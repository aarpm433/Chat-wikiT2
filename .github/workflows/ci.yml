name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test & lint tools
        run: pip install pytest ruff
      - name: Lint with ruff
        run: ruff check .
      - name: Run unit tests
        run: pytest
